name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['20.x']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install hledger
      if: runner.os != 'Windows'
      # Conformance fixtures pin behaviour verified against this version;
      # keep in step with the corpus (tests/integration/hledger-conformance/).
      # Installed from the official release binaries directly because
      # ngalaiko/setup-hledger@v1 only supports a stale version whitelist.
      env:
        HLEDGER_VERSION: 1.52.1
      run: |
        case "${{ runner.os }}" in
          Linux) asset=hledger-linux-x64.tar.gz ;;
          macOS) asset=hledger-mac-arm64.tar.gz ;;
        esac
        mkdir -p "$HOME/.local/bin"
        curl -sSL "https://github.com/simonmichael/hledger/releases/download/${HLEDGER_VERSION}/${asset}" \
          | tar xz -C "$HOME/.local/bin" hledger
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/hledger" --version

    - name: Install dependencies
      run: npm ci

    - name: Run tests (with conformance)
      if: runner.os != 'Windows'
      run: npm run test:all

    - name: Run tests
      if: runner.os == 'Windows'
      run: npm test

    - name: Run build
      run: npm run build

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}
        path: |
          coverage/
          test-results/
        if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check TypeScript compilation
      run: npm run build

    - name: Run ESLint
      run: npm run lint

  # Publishes only when a v* tag passes the full test matrix and lint above —
  # a tag whose tests fail is never published.
  publish:
    name: Publish to NPM
    needs: [test, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Publish to NPM
      run: npm publish
