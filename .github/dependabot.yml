version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Runtime deps land as one PR so the LSP/protocol packages move together.
      production:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
      # Toolchain churn (eslint, jest, ts, types) is noisy — one PR a week.
      development:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
    # Majors stay as individual PRs so breaking changes get reviewed on their own.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
